name: CI - Tests et SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality-check:
    name: Tests et analyse qualité
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Installation de Python
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # 3. Installation des dépendances
      - name: Install dependencies
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements.txt

      # 4. Tests et couverture
      - name: Run tests with coverage
        run: |
          python -m pytest -v \
            --cov=src \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # 5. Cache SonarQube
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 6. Analyse SonarQube
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
